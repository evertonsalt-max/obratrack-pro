/* ── Parser e validador de linhas ─────────────────────── */
function normStr(v){return String(v||'').trim();}
function normNum(v){const n=parseFloat(String(v||'0').replace(',','.'));return isNaN(n)?0:n;}
function normData(v){
  if(!v)return '';
  const s=String(v).trim();
  // XLSX às vezes entrega número serial para datas
  if(!isNaN(Number(s))&&Number(s)>40000){
    const d=new Date(Math.round((Number(s)-25569)*86400*1000));
    return d.toISOString().split('T')[0];
  }
  // formatos BR dd/mm/aaaa
  const br=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(br){const[,d,m,a]=br;return`${a.length===2?'20'+a:a}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;}
  // ISO ou parcial
  const iso=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso)return s;
  return s;
}
function normHora(v){
  const s=String(v||'').trim();
  if(!s)return '';
  const m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(m)return`${m[1].padStart(2,'0')}:${m[2]}`;
  return s;
}

function parseFuncionariosSheet(rows){
  return rows.map((row,i)=>{
    const erros=[];
    const nome=normStr(row[0]||row['Nome Completo*']||row['Nome Completo']||row['nome']);
    const apelido=normStr(row[1]||row['Apelido']||row['apelido']||'');
    const tel=normStr(row[2]||row['Telefone']||row['telefone']||'');
    const funcao=normStr(row[3]||row['Função*']||row['Função']||row['funcao']||row['função']||'');
    const diaria=normNum(row[4]||row['Valor Diária*']||row['Valor Diária']||row['diaria']||0);
    const statusRaw=normStr(row[5]||row['Status*']||row['Status']||row['status']||'ativo').toLowerCase();
    const status=statusRaw==='inativo'?'inativo':'ativo';
    const adm=normData(row[6]||row['Data Admissão']||row['admissao']||hoje);
    if(!nome)erros.push('Nome obrigatório');
    if(!funcao)erros.push('Função obrigatória');
    if(!diaria||diaria<=0)erros.push('Diária deve ser maior que zero');
    return{_linha:i+2,_erros:erros,_ok:erros.length===0,nome,apelido,tel,funcao,diaria,status,adm,ini:nome.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)};
  });
}

function parseRegistrosSheet(rows,funcs){
  return rows.map((row,i)=>{
    const erros=[];
    const nomeRaw=normStr(row[0]||row['Nome Funcionário*']||row['Nome Funcionário']||row['nome']||'');
    const data=normData(row[1]||row['Data* (AAAA-MM-DD)']||row['Data']||row['data']||'');
    const local=normStr(row[2]||row['Local/Obra*']||row['Local']||row['local']||'');
    const entrada=normHora(row[3]||row['Entrada (HH:MM)']||row['Entrada']||row['entrada']||'');
    const saida=normHora(row[4]||row['Saída (HH:MM)']||row['Saída']||row['saida']||'');
    const valeRaw=normStr(row[5]||row['Recebeu Vale? (sim/não)']||row['Vale']||row['vale']||'não').toLowerCase();
    const vale=valeRaw==='sim'||valeRaw==='s'||valeRaw==='yes'||valeRaw==='1'||valeRaw==='true';
    const valorVale=normNum(row[6]||row['Valor Vale']||row['valorVale']||0);
    const obs=normStr(row[7]||row['Observações']||row['obs']||'');
    // Jornada
    const jornadaRaw=normStr(row[8]||row['Jornada']||row['jornada']||'').toUpperCase();
    const jornada=jornadaRaw==='MEIO_TURNO'?'MEIO_TURNO':jornadaRaw==='OUTRO'?'OUTRO':'DIA_INTEIRO';
    // Casar funcionário
    const fn=funcs.find(f=>f.nome.toLowerCase()===nomeRaw.toLowerCase()||(f.apelido||'').toLowerCase()===nomeRaw.toLowerCase()||f.nome.toLowerCase().includes(nomeRaw.toLowerCase()));
    if(!nomeRaw)erros.push('Nome do funcionário obrigatório');
    else if(!fn)erros.push(`Funcionário "${nomeRaw}" não encontrado`);
    if(!data)erros.push('Data obrigatória');
    if(!local)erros.push('Local/Obra obrigatório');
    const horas=calcH(entrada,saida);
    return{_linha:i+2,_erros:erros,_ok:erros.length===0,_nomeRaw:nomeRaw,funcId:fn?.id||null,nome:fn?.apelido||fn?.nome?.split(' ')[0]||nomeRaw,data,local,entrada,saida,horas,diaria:fn?.diaria||0,vale,valorVale:vale?valorVale:0,obs,jornada};
  });
}

function parsePagamentosSheet(rows,funcs){
  const TIPOS=['Semanal','Quinzenal','Mensal','Adiantamento','Acerto Final'];
  return rows.map((row,i)=>{
    const erros=[];
    const nomeRaw=normStr(row[0]||row['Nome Funcionário*']||row['Nome Funcionário']||row['nome']||'');
    const data=normData(row[1]||row['Data* (AAAA-MM-DD)']||row['Data']||row['data']||'');
    const valor=normNum(row[2]||row['Valor* (R$)']||row['Valor']||row['valor']||0);
    const tipoRaw=normStr(row[3]||row['Tipo*']||row['Tipo']||row['tipo']||'Semanal');
    const tipo=TIPOS.find(t=>t.toLowerCase()===tipoRaw.toLowerCase())||tipoRaw||'Semanal';
    const obs=normStr(row[4]||row['Observações']||row['obs']||'');
    const fn=funcs.find(f=>f.nome.toLowerCase()===nomeRaw.toLowerCase()||(f.apelido||'').toLowerCase()===nomeRaw.toLowerCase()||f.nome.toLowerCase().includes(nomeRaw.toLowerCase()));
    if(!nomeRaw)erros.push('Nome do funcionário obrigatório');
    else if(!fn)erros.push(`Funcionário "${nomeRaw}" não encontrado`);
    if(!data)erros.push('Data obrigatória');
    if(!valor||valor<=0)erros.push('Valor deve ser maior que zero');
    return{_linha:i+2,_erros:erros,_ok:erros.length===0,_nomeRaw:nomeRaw,funcId:fn?.id||null,nome:fn?.apelido||fn?.nome?.split(' ')[0]||nomeRaw,data,valor,tipo,obs};
  });
}

/* ── Componente principal de importação ─────────────────── */
function Importar({funcs,setFuncs,regs,setRegs,pags,setPags,obras,setObras,t,toast}){
  const [etapa,setEtapa]=useState('inicio'); // inicio | processando | preview | sucesso
  const [tipo,setTipo]=useState('registros'); // funcionarios | registros | pagamentos
  const [arquivo,setArquivo]=useState(null);
  const [progresso,setProgresso]=useState(0);
  const [linhas,setLinhas]=useState([]); // todas as linhas parseadas
  const [selecionadas,setSelecionadas]=useState([]); // ids selecionados para importar (só as ok)
  const [historico,setHistorico]=useState([]);
  const fileRef=useRef();
  const dropRef=useRef();
  const [dragOver,setDragOver]=useState(false);

  const TIPOS_CONFIG={
    funcionarios:{label:'Funcionários',    icon:'users', cor:'#3b82f6',desc:'Importar cadastro de funcionários em massa'},
    registros:   {label:'Registros de Horas',icon:'clock',cor:'#8b5cf6',desc:'Importar dias trabalhados e vales'},
    pagamentos:  {label:'Pagamentos',      icon:'dollar',cor:'#22c55e',desc:'Importar histórico de pagamentos'},
  };

  const processarArquivo=async(file)=>{
    if(!file)return;
    setArquivo(file);
    setEtapa('processando');
    setProgresso(0);

    const timer=setInterval(()=>setProgresso(p=>Math.min(p+12,88)),80);
    try{
      const buf=await file.arrayBuffer();
      clearInterval(timer);
      setProgresso(92);

      let rows=[];
      const ext=file.name.split('.').pop().toLowerCase();

      if(ext==='csv'){
        const txt=new TextDecoder('utf-8').decode(buf);
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        const header=lines[0].split(/[;,]/).map(h=>h.replace(/"/g,'').trim());
        rows=lines.slice(1).map(line=>{
          const vals=line.split(/[;,]/).map(v=>v.replace(/"/g,'').trim());
          const obj={};header.forEach((h,i)=>obj[h]=vals[i]||'');
          return obj;
        }).filter(r=>Object.values(r).some(v=>v));
      } else {
        const wb=XLSX.read(buf,{type:'array',cellDates:true});
        const wsName=wb.SheetNames[0];
        const ws=wb.Sheets[wsName];
        // Usar header:1 para pegar array e depois header com a primeira linha como chave
        const rawRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(rawRows.length<2){toast('Planilha vazia ou sem dados.','err');setEtapa('inicio');return;}
        const headers=rawRows[0].map(h=>String(h).trim());
        rows=rawRows.slice(1)
          .filter(row=>row.some(v=>v!==''&&v!==null&&v!==undefined))
          .map(row=>{
            const obj={};
            // índice posicional (para planilhas de modelo)
            row.forEach((v,i)=>{obj[i]=v;if(headers[i])obj[headers[i]]=v;});
            return obj;
          });
      }

      setProgresso(96);
      let parsed=[];
      if(tipo==='funcionarios') parsed=parseFuncionariosSheet(rows);
      else if(tipo==='registros') parsed=parseRegistrosSheet(rows,funcs);
      else parsed=parsePagamentosSheet(rows,funcs);

      setProgresso(100);
      setTimeout(()=>{
        setLinhas(parsed);
        setSelecionadas(parsed.filter(r=>r._ok).map((_,i)=>i));
        setEtapa('preview');
      },400);
    }catch(e){
      clearInterval(timer);
      toast('Erro ao ler arquivo: '+e.message,'err');
      setEtapa('inicio');
    }
  };

  const onDrop=e=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files[0];if(f)processarArquivo(f);};
  const onFile=e=>{const f=e.target.files[0];if(f)processarArquivo(f);e.target.value='';};
  const toggleSel=i=>setSelecionadas(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]);
  const toggleTodos=()=>{const ok=linhas.map((_,i)=>i).filter(i=>linhas[i]._ok);setSelecionadas(p=>p.length===ok.length?[]:ok);};

  const confirmarImportacao=()=>{
    const okLinhas=selecionadas.map(i=>linhas[i]).filter(l=>l._ok);
    if(okLinhas.length===0){toast('Nenhuma linha válida selecionada.','err');return;}

    if(tipo==='funcionarios'){
      const novos=okLinhas.map(l=>({...l,id:uid(),_linha:undefined,_erros:undefined,_ok:undefined}));
      setFuncs(p=>[...p,...novos]);
    } else if(tipo==='registros'){
      const novos=okLinhas.map(l=>({...l,id:uid(),_linha:undefined,_erros:undefined,_ok:undefined,_nomeRaw:undefined}));
      setRegs(p=>[...p,...novos]);
      // Adicionar obras novas
      const novasObras=[...new Set(okLinhas.map(l=>l.local).filter(Boolean))].filter(o=>!obras.includes(o));
      if(novasObras.length)setObras(p=>[...p,...novasObras]);
    } else {
      const novos=okLinhas.map(l=>({...l,id:uid(),_linha:undefined,_erros:undefined,_ok:undefined,_nomeRaw:undefined}));
      setPags(p=>[...p,...novos]);
    }

    const reg={id:uid(),data:new Date().toISOString(),tipo:TIPOS_CONFIG[tipo].label,total:okLinhas.length,arquivo:arquivo?.name||'',erros:linhas.filter(l=>!l._ok).length};
    setHistorico(p=>[reg,...p]);
    toast(`${okLinhas.length} registros importados com sucesso!`,'ok');
    setEtapa('sucesso');
  };

  const resetar=()=>{setEtapa('inicio');setLinhas([]);setSelecionadas([]);setArquivo(null);setProgresso(0);};

  // ── RENDER ────────────────────────────────────────────

  const cfg=TIPOS_CONFIG[tipo];
  const okCount=linhas.filter(l=>l._ok).length;
  const errCount=linhas.filter(l=>!l._ok).length;
  const selCount=selecionadas.length;

  return(
    <div style={{padding:22,overflowY:'auto',flex:1,animation:'slideIn .2s ease'}}>

      {/* ETAPA: SUCESSO */}
      {etapa==='sucesso'&&(
        <div style={{maxWidth:640,margin:'0 auto'}}>
          <Crd t={t} sx={{textAlign:'center',padding:'48px 40px',marginBottom:18}}>
            <div style={{width:72,height:72,background:t.ok+'20',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 18px'}}><Ic n="check" s={34} c={t.ok}/></div>
            <h2 style={{color:t.txt,fontSize:22,fontWeight:800,marginBottom:8}}>Importação Concluída!</h2>
            <p style={{color:t.sub,fontSize:13,marginBottom:6}}>Os dados foram importados e salvos automaticamente.</p>
            <p style={{color:t.ok,fontSize:14,fontWeight:700,marginBottom:28}}>{selCount} registro(s) importado(s) com sucesso</p>
            <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
              <Btn t={t} onClick={resetar} icon="import">Nova Importação</Btn>
              <Btn v="ghost" t={t} onClick={()=>{setEtapa('preview');}}>Ver Prévia Novamente</Btn>
            </div>
          </Crd>
          {historico.length>0&&(
            <Crd t={t} title="Histórico de Importações">
              {historico.map((h,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:i<historico.length-1?`1px solid ${t.brd}`:'none'}}>
                  <div>
                    <p style={{color:t.txt,fontSize:13,fontWeight:600}}>{h.tipo}</p>
                    <p style={{color:t.sub,fontSize:11}}>{h.arquivo} · {new Date(h.data).toLocaleString('pt-BR')}</p>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <Bdg cor="green" t={t}>{h.total} importados</Bdg>
                    {h.erros>0&&<p style={{color:t.warn,fontSize:11,marginTop:3}}>{h.erros} com erro</p>}
                  </div>
                </div>
              ))}
            </Crd>
          )}
        </div>
      )}

      {/* ETAPA: PROCESSANDO */}
      {etapa==='processando'&&(
        <div style={{maxWidth:500,margin:'60px auto 0',textAlign:'center'}}>
          <Crd t={t} sx={{padding:'48px 40px'}}>
            <div style={{width:56,height:56,background:t.ac+'18',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}><Ic n="refresh" s={28} c={t.ac}/></div>
            <p style={{color:t.txt,fontSize:16,fontWeight:700,marginBottom:6}}>Processando arquivo...</p>
            <p style={{color:t.sub,fontSize:12,marginBottom:24}}>{arquivo?.name}</p>
            <div style={{background:t.inp,borderRadius:20,height:8,overflow:'hidden',marginBottom:10}}>
              <div style={{height:'100%',background:`linear-gradient(90deg,${t.ac},${t.pur})`,borderRadius:20,width:`${progresso}%`,transition:'width .3s ease'}}/>
            </div>
            <p style={{color:t.sub,fontSize:12}}>{progresso}% — Lendo e validando dados...</p>
          </Crd>
        </div>
      )}

      {/* ETAPA: INÍCIO */}
      {etapa==='inicio'&&(
        <div style={{maxWidth:860,margin:'0 auto'}}>
          {/* Tipo de importação */}
          <div style={{marginBottom:22}}>
            <p style={{color:t.sub,fontSize:12,fontWeight:700,marginBottom:10,textTransform:'uppercase',letterSpacing:.5}}>1. Selecione o tipo de dados</p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
              {Object.entries(TIPOS_CONFIG).map(([k,v])=>(
                <button key={k} onClick={()=>setTipo(k)}
                  style={{padding:'16px',borderRadius:12,border:`2px solid ${tipo===k?v.cor:t.brd}`,background:tipo===k?v.cor+'14':t.card,cursor:'pointer',textAlign:'left',transition:'all .15s'}}>
                  <div style={{background:v.cor+'20',borderRadius:8,width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:10}}>
                    <Ic n={v.icon} s={18} c={v.cor}/>
                  </div>
                  <p style={{color:tipo===k?v.cor:t.txt,fontSize:13,fontWeight:700,marginBottom:3}}>{v.label}</p>
                  <p style={{color:t.sub,fontSize:11,lineHeight:1.5}}>{v.desc}</p>
                </button>
              ))}
            </div>
          </div>

          {/* Download do modelo */}
          <Crd t={t} sx={{marginBottom:18}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{background:'#14532d',borderRadius:10,padding:10,flexShrink:0}}><Ic n="table" s={20} c="#4ade80"/></div>
                <div>
                  <p style={{color:t.txt,fontSize:14,fontWeight:700}}>2. Baixe o modelo Excel</p>
                  <p style={{color:t.sub,fontSize:12}}>Preencha o modelo com seus dados. Ele já contém exemplos e as colunas obrigatórias marcadas com *</p>
                </div>
              </div>
              <button onClick={()=>{
                if(tipo==='funcionarios')gerarModeloFuncionarios();
                else if(tipo==='registros')gerarModeloRegistros();
                else gerarModeloPagamentos();
                toast('Modelo Excel baixado!','ok');
              }} style={{padding:'10px 18px',background:'#14532d',border:'1px solid #166534',borderRadius:9,color:'#4ade80',fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:8,whiteSpace:'nowrap'}}>
                <Ic n="dl" s={15} c="#4ade80"/>Baixar Modelo — {cfg.label}
              </button>
            </div>
          </Crd>

          {/* Zona de upload */}
          <div
            ref={dropRef}
            onDrop={onDrop}
            onDragOver={e=>{e.preventDefault();setDragOver(true);}}
            onDragLeave={()=>setDragOver(false)}
            onClick={()=>fileRef.current?.click()}
            style={{border:`2px dashed ${dragOver?cfg.cor:t.brd}`,borderRadius:16,padding:'48px 32px',textAlign:'center',cursor:'pointer',background:dragOver?cfg.cor+'08':t.card,transition:'all .2s',marginBottom:18}}>
            <div style={{width:64,height:64,background:cfg.cor+'16',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
              <Ic n="import" s={28} c={cfg.cor}/>
            </div>
            <p style={{color:t.txt,fontSize:16,fontWeight:700,marginBottom:6}}>3. Faça upload da sua planilha</p>
            <p style={{color:t.sub,fontSize:13,marginBottom:16}}>Arraste e solte aqui, ou clique para selecionar</p>
            <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
              {['.xlsx','.xls','.csv'].map(ext=><span key={ext} style={{background:t.bdg,color:t.sub,padding:'3px 10px',borderRadius:6,fontSize:11,fontWeight:600}}>{ext}</span>)}
            </div>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:'none'}} onChange={onFile}/>

            <p style={{color:t.txt,fontSize:13,fontWeight:700,marginBottom:12}}>💡 Dicas para uma importação bem-sucedida</p>

              {[
                {ic:'check',c:t.ok,  txt:'Use o modelo oficial para garantir compatibilidade das colunas'},

                {ic:'check',c:t.ok,  txt:'Campos com * são obrigatórios e não podem ficar em branco'},

                {ic:'alert',c:t.warn,txt:'Remova linhas de cabeçalho extras antes de enviar'},
                {ic:'alert',c:t.warn,txt:'Salve o arquivo como .xlsx — evite formatos de versão antiga .xls'},
              ].map((d,i)=>(
                <div key={i} style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                  <Ic n={d.ic} s={14} c={d.c}/>

                </div>
              ))}
            </div>
          </Crd>
        </div>
      )}

      {/* ETAPA: PREVIEW */}
      {etapa==='preview'&&(
        <div style={{maxWidth:1100,margin:'0 auto'}}>
          {/* Resumo */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:18}}>
            {[
              {l:'Total de linhas',   v:linhas.length,       c:t.txt,  ic:'table'},
              {l:'Linhas válidas',    v:okCount,             c:t.ok,   ic:'check'},
              {l:'Linhas com erro',   v:errCount,            c:t.err,  ic:'alert'},
              {l:'Selecionadas p/ importar',v:selCount,      c:t.ac,   ic:'import'},
            ].map((s,i)=>(
              <div key={i} style={{background:t.card,border:`1px solid ${s.c}30`,borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
                <div style={{background:s.c+'18',borderRadius:8,padding:8,flexShrink:0}}><Ic n={s.ic} s={16} c={s.c}/></div>
                <div><p style={{color:t.sub,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:.5,marginBottom:2}}>{s.l}</p><p style={{color:s.c,fontSize:20,fontWeight:800}}>{s.v}</p></div>
              </div>
            ))}
          </div>

          {errCount>0&&(
            <div style={{background:t.err+'10',border:`1px solid ${t.err}40`,borderRadius:10,padding:'12px 16px',marginBottom:14,display:'flex',gap:10,alignItems:'flex-start'}}>
              <Ic n="alert" s={16} c={t.err}/>
              <div>
                <p style={{color:t.err,fontSize:13,fontWeight:700,marginBottom:3}}>{errCount} linha(s) com erro serão ignoradas</p>
                <p style={{color:t.sub,fontSize:12}}>Você pode corrigir a planilha e reimportar, ou importar apenas as linhas válidas selecionadas.</p>
              </div>
            </div>
          )}

          {/* Tabela de prévia */}
          <Crd t={t} noPad sx={{marginBottom:14}}>
            <div style={{padding:'14px 18px',borderBottom:`1px solid ${t.brd}`,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
              <div>
                <p style={{color:t.txt,fontSize:14,fontWeight:700}}>Prévia dos dados — {cfg.label}</p>
                <p style={{color:t.sub,fontSize:12}}>Arquivo: {arquivo?.name} · Marque as linhas que deseja importar</p>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <button onClick={()=>setEtapa('inicio')} style={{background:'transparent',border:`1px solid ${t.brd}`,borderRadius:8,padding:'7px 12px',color:t.sub,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',gap:6}}>
                  <Ic n="refresh" s={13} c={t.sub}/>Trocar arquivo
                </button>
                <button onClick={toggleTodos} style={{background:t.ac+'14',border:`1px solid ${t.ac}30`,borderRadius:8,padding:'7px 12px',color:t.ac,cursor:'pointer',fontSize:12,fontWeight:600}}>
                  {selecionadas.length===okCount?'Desmarcar todos':'Selecionar todos válidos'}
                </button>
              </div>
            </div>
            <div style={{overflowX:'auto',maxHeight:420,overflowY:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead style={{position:'sticky',top:0,background:t.card,zIndex:1}}>
                  <tr style={{borderBottom:`2px solid ${t.brd}`}}>
                    <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5,width:40}}>✓</th>
                    <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5,width:40}}>Linha</th>
                    <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Status</th>
                    {tipo==='funcionarios'&&<>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Nome</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Função</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Diária</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Status</th>
                    </>}
                    {tipo==='registros'&&<>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Funcionário</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Data</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Local</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Entrada</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Saída</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Horas</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Vale</th>
                    </>}
                    {tipo==='pagamentos'&&<>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Funcionário</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Data</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Valor</th>
                      <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Tipo</th>
                    </>}
                    <th style={{padding:'9px 14px',color:t.sub,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:.5}}>Erros</th>
                  </tr>
                </thead>
                <tbody>
                  {linhas.map((row,i)=>{
                    const sel=selecionadas.includes(i);
                    const bgRow=!row._ok?t.err+'08':sel?t.ok+'06':'transparent';
                    return(
                      <tr key={i} style={{borderBottom:`1px solid ${t.brd}`,background:bgRow,transition:'background .1s'}}
                        onMouseEnter={e=>e.currentTarget.style.background=row._ok?t.hov:t.err+'12'}
                        onMouseLeave={e=>e.currentTarget.style.background=bgRow}>
                        <td style={{padding:'9px 14px',textAlign:'center'}}>
                          {row._ok
                            ?<input type="checkbox" checked={sel} onChange={()=>toggleSel(i)} style={{width:15,height:15,cursor:'pointer',accentColor:t.ok}}/>
                            :<Ic n="x" s={14} c={t.err}/>}
                        </td>
                        <td style={{padding:'9px 14px',color:t.sub,fontSize:11}}>{row._linha}</td>
                        <td style={{padding:'9px 14px'}}>
                          {row._ok
                            ?<Bdg cor="green" t={t}>✓ Válido</Bdg>
                            :<Bdg cor="red" t={t}>✗ Erro</Bdg>}
                        </td>
                        {tipo==='funcionarios'&&<>
                          <td style={{padding:'9px 14px',color:t.txt,fontWeight:600}}>{row.nome||'—'}</td>
                          <td style={{padding:'9px 14px',color:t.sub}}>{row.funcao||'—'}</td>
                          <td style={{padding:'9px 14px',color:t.ok,fontWeight:600}}>{row.diaria>0?fmtR$(row.diaria):'—'}</td>
                          <td style={{padding:'9px 14px'}}><Bdg cor={row.status==='ativo'?'green':'gray'} t={t}>{row.status}</Bdg></td>
                        </>}
                        {tipo==='registros'&&<>
                          <td style={{padding:'9px 14px',color:t.txt,fontWeight:600}}>{row._nomeRaw||row.nome||'—'}</td>
                          <td style={{padding:'9px 14px',color:t.sub,fontSize:11}}>{row.data?fmtBR(row.data):'—'}</td>
                          <td style={{padding:'9px 14px',color:t.sub,fontSize:11,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{row.local||'—'}</td>
                          <td style={{padding:'9px 14px',color:t.txt}}>{row.entrada||'—'}</td>
                          <td style={{padding:'9px 14px',color:t.txt}}>{row.saida||'—'}</td>
                          <td style={{padding:'9px 14px'}}><Bdg cor="purple" t={t}>{row.horas||0}h</Bdg></td>
                          <td style={{padding:'9px 14px'}}>{row.vale?<Bdg cor="yellow" t={t}>{fmtR$(row.valorVale)}</Bdg>:<Bdg cor="gray" t={t}>Não</Bdg>}</td>
                        </>}
                        {tipo==='pagamentos'&&<>
                          <td style={{padding:'9px 14px',color:t.txt,fontWeight:600}}>{row._nomeRaw||row.nome||'—'}</td>
                          <td style={{padding:'9px 14px',color:t.sub,fontSize:11}}>{row.data?fmtBR(row.data):'—'}</td>
                          <td style={{padding:'9px 14px',color:t.ok,fontWeight:700}}>{row.valor>0?fmtR$(row.valor):'—'}</td>
                          <td style={{padding:'9px 14px'}}><Bdg cor="blue" t={t}>{row.tipo||'—'}</Bdg></td>
                        </>}
                        <td style={{padding:'9px 14px',maxWidth:240}}>
                          {row._erros.length>0
                            ?<span style={{color:t.err,fontSize:11}}>{row._erros.join(' · ')}</span>
                            :<span style={{color:t.ok,fontSize:11}}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Crd>

          {/* Botões de ação */}
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={()=>setEtapa('inicio')} style={{padding:'10px 18px',background:'transparent',border:`1px solid ${t.brd}`,borderRadius:9,color:t.sub,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
              <Ic n="cL" s={14} c={t.sub}/>Voltar
            </button>
            {errCount>0&&(
              <span style={{color:t.sub,fontSize:12,flex:1}}>
                {errCount} linha(s) com erro serão ignoradas · {selCount} serão importadas
              </span>
            )}
            <button
              onClick={confirmarImportacao}
              disabled={selCount===0}
              style={{padding:'11px 24px',background:selCount===0?t.hov:`linear-gradient(135deg,${t.ac},${t.pur})`,border:'none',borderRadius:9,color:selCount===0?t.sub:'#fff',fontSize:14,fontWeight:700,cursor:selCount===0?'not-allowed':'pointer',display:'flex',alignItems:'center',gap:9,opacity:selCount===0?.6:1}}>
              <Ic n="import" s={16} c={selCount===0?t.sub:'#fff'}/>
              Confirmar e Importar {selCount>0?`(${selCount} registros)`:''}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   CONFIGURAÇÕES & BACKUP
══════════════════════════════════════════════════════ */
function Config({funcs,regs,pags,obras,onRestore,ultimoSave,t,toast}){
  const fileRef=useRef();
  const totalDados={funcs:funcs.length,regs:regs.length,pags:pags.length,obras:obras.length};
  const salvoEm=ultimoSave?new Date(ultimoSave).toLocaleString('pt-BR'):'Nunca';
  const tamanho=()=>{try{const s=localStorage.getItem(LS_KEY)||'';return(s.length/1024).toFixed(1)+' KB';}catch{return'?';}};

  const doBackup=()=>{exportarBackupJSON({funcs,regs,pags,obras});toast('Backup JSON exportado!','ok');};
  const doRestore=e=>{const f=e.target.files[0];if(!f)return;importarBackupJSON(f,dados=>{if(dados.funcs&&dados.regs){onRestore(dados);toast('Backup restaurado com sucesso!','ok');}else{toast('Arquivo de backup inválido.','err');}});e.target.value='';};
  const limparTudo=()=>{if(!confirm('⚠️ ATENÇÃO: Isso apagará TODOS os dados permanentemente. Tem certeza?'))return;try{localStorage.removeItem(LS_KEY);}catch{}toast('Todos os dados foram apagados. Recarregue a página.','err');setTimeout(()=>window.location.reload(),2000);};

  return(
    <div style={{padding:22,maxWidth:760,overflowY:'auto',flex:1,animation:'slideIn .2s ease'}}>
      {/* Status do armazenamento */}
      <Crd t={t} sx={{marginBottom:18}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{background:t.ok+'18',borderRadius:10,padding:10}}><Ic n="shield" s={22} c={t.ok}/></div>
          <div>
            <p style={{color:t.txt,fontSize:15,fontWeight:700}}>Seus dados estão protegidos</p>
            <p style={{color:t.sub,fontSize:12}}>Salvamento automático ativado no navegador</p>
          </div>
          <div style={{marginLeft:'auto',background:t.ok+'14',border:`1px solid ${t.ok}30`,borderRadius:8,padding:'8px 14px',display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:t.ok}}/>
            <span style={{color:t.ok,fontSize:12,fontWeight:700}}>ATIVO</span>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
          {[{l:'Funcionários',v:totalDados.funcs,ic:'users',c:t.ac},{l:'Registros',v:totalDados.regs,ic:'clock',c:t.pur},{l:'Pagamentos',v:totalDados.pags,ic:'dollar',c:t.ok},{l:'Obras',v:totalDados.obras,ic:'pin',c:t.warn}].map((i,k)=>(
            <div key={k} style={{background:t.inp,border:`1px solid ${t.inpB}`,borderRadius:10,padding:'12px 14px',display:'flex',alignItems:'center',gap:10}}>
              <Ic n={i.ic} s={16} c={i.c}/>
              <div><p style={{color:t.sub,fontSize:10}}>{i.l}</p><p style={{color:i.c,fontSize:18,fontWeight:800}}>{i.v}</p></div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:20,marginTop:14,padding:'12px 0',borderTop:`1px solid ${t.brd}`}}>
          <div><p style={{color:t.sub,fontSize:11}}>Último salvamento</p><p style={{color:t.txt,fontSize:13,fontWeight:600}}>{salvoEm}</p></div>
          <div><p style={{color:t.sub,fontSize:11}}>Espaço utilizado</p><p style={{color:t.txt,fontSize:13,fontWeight:600}}>{tamanho()}</p></div>
          <div><p style={{color:t.sub,fontSize:11}}>Armazenamento</p><p style={{color:t.txt,fontSize:13,fontWeight:600}}>localStorage (neste navegador)</p></div>
        </div>
      </Crd>

      {/* Como funciona */}
      <Crd t={t} sx={{marginBottom:18}}>
        <h3 style={{color:t.txt,fontSize:14,fontWeight:700,marginBottom:14}}>Como seus dados são salvos</h3>
        {[
          {ico:'save',  cor:t.ok,  titulo:'Auto-save contínuo',       desc:'Cada ação (criar, editar, excluir) salva imediatamente no localStorage do navegador. Os dados persistem ao fechar e reabrir o navegador.'},
          {ico:'shield',cor:t.ac,  titulo:'Dados locais e privados',   desc:'Tudo fica no seu computador, no banco de dados do navegador. Nenhum dado é enviado para servidores externos.'},
          {ico:'alert', cor:t.warn,titulo:'Risco: limpeza do navegador',desc:'Se você limpar cookies/cache do Chrome ou reinstalar o navegador, os dados serão perdidos. Por isso, faça backups regulares.'},
          {ico:'backup',cor:t.pur, titulo:'Backup recomendado',        desc:'Exporte um backup JSON semanalmente e salve no Google Drive, pendrive ou e-mail. Isso garante segurança total dos seus dados.'},
        ].map((item,i)=>(
          <div key={i} style={{display:'flex',gap:12,padding:'12px 0',borderBottom:i<3?`1px solid ${t.brd}`:'none'}}>
            <div style={{background:item.cor+'18',borderRadius:8,padding:8,flexShrink:0,height:'fit-content'}}><Ic n={item.ico} s={16} c={item.cor}/></div>
            <div><p style={{color:t.txt,fontSize:13,fontWeight:600,marginBottom:3}}>{item.titulo}</p><p style={{color:t.sub,fontSize:12,lineHeight:1.6}}>{item.desc}</p></div>
          </div>
        ))}
      </Crd>

      {/* Backup & Restaurar */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        <Crd t={t}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
            <div style={{background:t.ok+'18',borderRadius:8,padding:8}}><Ic n="dl" s={18} c={t.ok}/></div>
            <div><p style={{color:t.txt,fontSize:14,fontWeight:700}}>Exportar Backup</p><p style={{color:t.sub,fontSize:11}}>Arquivo JSON com todos os dados</p></div>
          </div>
          <p style={{color:t.sub,fontSize:12,lineHeight:1.6,marginBottom:14}}>Salva um arquivo <strong style={{color:t.txt}}>.json</strong> no seu computador com todos os funcionários, registros de trabalho, pagamentos e obras. Guarde em local seguro.</p>
          <Btn v="success" icon="dl" t={t} sx={{width:'100%',justifyContent:'center'}} onClick={doBackup}>Exportar Backup JSON</Btn>
        </Crd>
        <Crd t={t}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
            <div style={{background:t.ac+'18',borderRadius:8,padding:8}}><Ic n="backup" s={18} c={t.ac}/></div>
            <div><p style={{color:t.txt,fontSize:14,fontWeight:700}}>Restaurar Backup</p><p style={{color:t.sub,fontSize:11}}>Importar arquivo de backup anterior</p></div>
          </div>
          <p style={{color:t.sub,fontSize:12,lineHeight:1.6,marginBottom:14}}>Selecione um arquivo <strong style={{color:t.txt}}>.json</strong> exportado anteriormente. Os dados atuais serão <strong style={{color:t.warn}}>substituídos</strong> pelos do backup.</p>
          <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={doRestore}/>
          <Btn v="secondary" icon="up" t={t} sx={{width:'100%',justifyContent:'center'}} onClick={()=>fileRef.current?.click()}>Carregar Arquivo de Backup</Btn>
        </Crd>
      </div>

      {/* Excel */}
      <Crd t={t} sx={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{background:'#166534',borderRadius:8,padding:8}}><Ic n="dl" s={18} c="#4ade80"/></div>
            <div><p style={{color:t.txt,fontSize:14,fontWeight:700}}>Exportar Excel (.xlsx)</p><p style={{color:t.sub,fontSize:11}}>3 abas: Registros, Resumo por funcionário, Pagamentos</p></div>
          </div>
          <button onClick={()=>{try{exportXLSX(regs,funcs,pags);toast('Excel exportado!','ok');}catch{toast('Erro ao exportar.','err');}}}
            style={{padding:'9px 18px',background:'#14532d',border:'1px solid #166534',borderRadius:8,color:'#4ade80',fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
            <Ic n="dl" s={15} c="#4ade80"/>Exportar Excel
          </button>
        </div>
      </Crd>

      {/* Zona de perigo */}
      <Crd t={t} sx={{border:`1px solid ${t.err}40`,background:t.err+'06'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{background:t.err+'18',borderRadius:8,padding:8}}><Ic n="trash" s={18} c={t.err}/></div>
            <div><p style={{color:t.err,fontSize:14,fontWeight:700}}>Zona de Perigo</p><p style={{color:t.sub,fontSize:11}}>Apagar todos os dados permanentemente</p></div>
          </div>
          <button onClick={limparTudo} style={{padding:'9px 18px',background:'transparent',border:`1px solid ${t.err}`,borderRadius:8,color:t.err,fontSize:13,fontWeight:700,cursor:'pointer'}}>Apagar Tudo</button>
        </div>
      </Crd>
    </div>
  );
}

/* ══════════════════════════════════════════════════════
   APP PRINCIPAL
══════════════════════════════════════════════════════ */
function App(){
  // Carregar do localStorage na inicialização
  const inicial=()=>{
    const saved=carregarStorage();
    if(saved&&saved.funcs){return saved;}
    return{funcs:FUNC0,regs:REG0,pags:PAG0,obras:OBRAS0};
  };

  const [dark,setDark]=useState(()=>{try{return localStorage.getItem('ot_dark')!=='false';}catch{return true;}});
  const [col,setCol]=useState(false);
  const [pg,setPg]=useState('dash');
  const [busca,setBusca]=useState('');
  const [ultimoSave,setUltimoSave]=useState(null);
  const [toasts,setToasts]=useState([]);

  const init=inicial();
  const [funcs,setFuncs]=useState(init.funcs||FUNC0);
  const [regs,setRegs]=useState(init.regs||REG0);
  const [pags,setPags]=useState(init.pags||PAG0);
  const [obras,setObras]=useState(init.obras||OBRAS0);

  const t=dark?DK:LT;

  // Toast helper
  const toast=useCallback((msg,type='info')=>{
    const id=uid();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
  },[]);

  // Auto-save sempre que dados mudam
  useEffect(()=>{
    const dados={funcs,regs,pags,obras};
    salvarStorage(dados);
    setUltimoSave(new Date().toISOString());
  },[funcs,regs,pags,obras]);

  // Salvar preferência de tema
  useEffect(()=>{try{localStorage.setItem('ot_dark',dark);}catch{}document.body.style.background=t.bg;},[dark,t]);

  const addReg=r=>{setRegs(p=>[...p,r]);if(r.local&&!obras.includes(r.local))setObras(o=>[...o,r.local]);};
  const onRestore=dados=>{if(dados.funcs)setFuncs(dados.funcs);if(dados.regs)setRegs(dados.regs);if(dados.pags)setPags(dados.pags);if(dados.obras)setObras(dados.obras);};

  return(
    <div style={{display:'flex',height:'100vh',background:t.bg,overflow:'hidden'}}>
      <Sidebar pg={pg} setPg={k=>{setPg(k);setBusca('');}} t={t} dark={dark} setDark={setDark} col={col} setCol={setCol} ultimoSave={ultimoSave}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        <Topbar t={t} pg={pg} busca={busca} setBusca={setBusca}/>
        <div style={{flex:1,overflowY:'auto'}}>
          {pg==='dash'  &&<Dashboard funcs={funcs} regs={regs} pags={pags} t={t} setPg={setPg}/>}
          {pg==='funcs' &&<Funcs     funcs={funcs} setFuncs={setFuncs} regs={regs} busca={busca} t={t} toast={toast}/>}
          {pg==='horas' &&<Horas     regs={regs} setRegs={setRegs} funcs={funcs} obras={obras} setObras={setObras} busca={busca} t={t} toast={toast}/>}
          {pg==='pags'  &&<Pags      pags={pags} setPags={setPags} regs={regs} funcs={funcs} t={t} toast={toast}/>}
          {pg==='rels'  &&<Rels      regs={regs} funcs={funcs} pags={pags} t={t} toast={toast}/>}
          {pg==='audio' &&<Audio     funcs={funcs} obras={obras} setObras={setObras} onSalvar={addReg} t={t} toast={toast}/>}
          {pg==='obras' &&<Obras     obras={obras} setObras={setObras} regs={regs} t={t} toast={toast}/>}
          {pg==='import'&&<Importar  funcs={funcs} setFuncs={setFuncs} regs={regs} setRegs={setRegs} pags={pags} setPags={setPags} obras={obras} setObras={setObras} t={t} toast={toast}/>}
          {pg==='config'&&<Config    funcs={funcs} regs={regs} pags={pags} obras={obras} onRestore={onRestore} ultimoSave={ultimoSave} t={t} toast={toast}/>}
        </div>
      </div>
      <Toast toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
